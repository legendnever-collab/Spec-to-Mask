name: v2 P0 UX prototype
on:
  push:
    branches: [feature/v2-learning-experience]
    paths: ['prototypes/v2-p0/**', 'docs/V2_*.md', '.github/workflows/v2-p0.yml']
  pull_request:
    paths: ['prototypes/v2-p0/**', 'docs/V2_*.md', '.github/workflows/v2-p0.yml']
permissions:
  contents: read
jobs:
  prototype:
    name: P0 isolated layout and interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node prototypes/v2-p0/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-p0-prototype-evidence
          path: |
            prototypes/v2-p0/verification.json
            prototypes/v2-p0/screenshots/
