<header class="top"><div class="brand">SPEC-to-MASK <span>Workbench</span></div><nav class="topnav" aria-label="Utilities"><button class="subtle enginebutton" id="engineTop">Engine overview</button><button class="subtle" id="theme" aria-label="Switch theme">Dark</button></nav></header>
<div class="mock"><strong>UX MOCK — NOT PHYSICS VERIFIED</strong><span class="long">P0 review · </span>Illustrations only. No game progress or solver results.</div>
<main id="app"></main>
<dialog id="learn" aria-labelledby="learnTitle"><header><h2 id="learnTitle">Learn Physics</h2><button id="closeLearn" aria-label="Close Learn Physics">Close</button></header><div class="learnbody" id="learnBody"></div></dialog>
<div id="announce" class="sr" aria-live="polite"></div>
<script>
'use strict';
// Isolated, memory-only UX fixture. No production modules, saves, scores, or backend.
const $=s=>document.querySelector(s), app=$('#app');
const original={wg:8,mzm:2},state={scene:new URLSearchParams(location.search).get('scene')||'overview',mode:'discover',values:{...original},revision:0,observed:{wg:false,mzm:false},snapshot:null,completed:false,skipped:false};
if(!['overview','wg','mzm'].includes(state.scene))state.scene='overview';
let focusBefore=null;
const S=()=>state.scene;const fmt=(n,d=2)=>Number(n).toFixed(d);
function model(){const L=state.values.mzm,ratio=2/L,phase=Math.PI*(.5+.25/ratio);return {revision:state.revision,radius:state.values.wg,footprint:((state.values.wg+.225)/(8+.225))**2,ratio,lossLength:L/2,phase,main:(1+Math.cos(phase))/2};}
function nav(scene){state.scene=scene;render();window.scrollTo(0,0);}
function header(eyebrow,question){return `<section class="intro"><div><p class="eyebrow">${eyebrow}</p><h1>${question}</h1><div class="context">1.6T MZM engine / 8 × 200G-class lanes · educational architecture target</div></div><span class="status">P0 · layout review</span></section>`;}
function review(){return `<nav class="reviewnav" aria-label="Prototype scenes"><span>Review scenes</span>${[['overview','Engine'],['wg','Waveguide'],['mzm','MZM']].map(([s,n])=>`<button data-scene="${s}" class="${S()===s?'selected':''}" aria-pressed="${S()===s}">${n}</button>`).join('')}</nav>`;}
function overview(){return header('Next · Waveguide Tutorial','Build one lane. Understand the whole engine.')+`<section class="overview"><article class="panel engine"><h2>1.6T MZM optical engine</h2><p>Start with light in a waveguide. Then turn one lane into eight.</p><div class="flow" aria-label="Laser to Tx PIC to optical interface to fiber to receiver"><div class="node"><b>CW laser</b><span>Shared source</span></div><div class="node active"><div><b>Tx PIC</b><span>Waveguide → MZM ×8</span></div><div class="lanes" aria-label="Eight planned lanes">${'<i></i>'.repeat(8)}</div></div><div class="node"><b>Interface</b><span>Chip ↔ fiber</span></div><div class="node"><b>Fiber</b><span>8 spatial lanes</span></div><div class="node"><b>Rx</b><span>PD + TIA ×8</span></div></div><div class="engine-bottom"><div><small>Architecture goal</small><strong>8 × 200G</strong><small>1.6T-class target</small></div><div><small>Link margin</small><strong>Not evaluated</strong><small>Build a lane first</small></div><div><small>Power / energy</small><strong>Not evaluated</strong><small>No system solver here</small></div></div></article><aside class="panel journey"><div><p class="eyebrow">Current chapter · 00</p><h2>Discover how light is guided</h2></div><ol class="stages"><li class="current"><span class="stepnum">00</span><div>Waveguide Tutorial<small>${state.completed?'Observed · prototype only':state.skipped?'Skipped · no completion awarded':'One geometry control. See what changes.'}</small></div></li><li><span class="stepnum">01</span><div>200G-class MZM lane<small>Length → phase → interference → eye</small></div></li><li><span class="stepnum">02</span><div>1.6T MZM engine<small>Repeat 8 lanes. Close the optical budget.</small></div></li><li><span class="stepnum">03+</span><div>MRM → EAM → comparison<small>Then 3.2T / 400G-class lane challenges</small></div></li></ol><div class="discovery"><h3>What to do next</h3><p>Move the bend-radius slider and watch the routing area change.</p></div><div class="actions"><button class="primary" data-scene="wg">Start Waveguide Tutorial →</button></div><p class="modelnote">Later chapters are the roadmap. This preview has three review scenes only.</p></aside></section>`+review();}
function bench(){const wg=S()==='wg';return header(wg?'00 · Waveguide Tutorial':'01 · MZM / Phase shifter length',wg?'Why does a sharp bend increase optical loss?':'Why does a longer MZM need less voltage?')+`<section class="workbench"><article class="panel physical" data-view="physical"><div class="panelhead"><h2>${wg?'Bend geometry':'MZI · phase → interference'}</h2><span class="caption">${wg?'Geometry only':'Ideal illustration'} · <span data-rev></span></span></div><div class="drawing" id="physical"></div><div class="diagramfoot">${wg?'No simulated leakage or bend-loss value.':'Phase marks in each arm; power redistributes after recombination.'}</div></article><article class="panel plot" data-view="plot"><div class="panelhead"><h2>${wg?'Area / bend loss':'Length → voltage / active loss'}</h2><span class="caption">${wg?'Geometry + unavailable model':'Normalized UX fixture'}</span></div><div class="plotbody" id="plot"></div><div class="legend">${wg?'<span class="a">● Area · geometry only</span><span>Bend loss: unavailable</span>':'<span class="a">● Vπ / Vπ₀</span><span class="b">● Active loss / loss₀</span>'}</div></article><aside class="panel aside"><div class="modes" aria-label="Learning mode"><button id="discover" class="active" aria-pressed="true">Discover</button>${wg?'<span class="caption" style="align-self:center">No performance gate</span>':'<button id="engineer" aria-pressed="false">Engineer</button>'}</div><section class="control"><label for="knob">${wg?'Bend radius':'Phase shifter length'}<output for="knob" id="value" class="value"></output></label><p>${wg?'Move the slider. Compare the routing area.':'Make the active section longer. Watch both curves.'}</p><input id="knob" aria-label="${wg?'Bend radius':'Phase shifter length'}" type="range" min="${wg?2:.5}" max="${wg?20:6}" step="${wg?.5:.05}" value="${state.values[S()]}"><div class="limits"><span>${wg?'2 µm · tight':'0.5 mm · short'}</span><span>${wg?'20 µm · gentle':'6 mm · long'}</span></div></section><section class="kpis" data-view="kpis" aria-label="Live observations"><div class="kpi"><label>${wg?'Bend loss':'Required Vπ / Vπ₀'}</label><b id="kpi1"></b><small id="delta1"></small></div><div class="kpi"><label>${wg?'Occupied area / area₀':'Active loss / loss₀'}</label><b id="kpi2"></b><small id="delta2"></small></div></section><section class="constraints" id="constraints" hidden><b>Engineer · example targets</b><p>Vπ / Vπ₀ ≤ 0.80 & active loss / loss₀ ≤ 1.40</p><p id="targetStatus"></p><p>Normalized UI targets. No real driver-voltage or dB requirement.</p></section><section class="discovery"><h3>${wg?'Notice the trade-off':'What changes together'}</h3><p id="why"></p></section><p class="modelnote">${wg?'Bend-loss solver not connected. Area is a geometric ratio, not a simulated optical result.':'Normalized illustration only. Vπ₀ / loss₀ at L₀ = 2 mm; fixed PN and fill factor. No actual V, dB, or PASS.'}</p><div class="secondary"><button id="compare">Capture comparison</button><button id="restore" disabled>Restore comparison</button><button id="reset">Original</button></div><div class="actions"><button id="learnButton">Learn Physics</button>${wg?'<button id="skip" class="subtle">Skip</button><button class="primary" id="continue">Continue →</button>':'<button class="primary" data-scene="overview">Engine overview →</button>'}</div><div class="sceneindicator" id="comparison"></div></aside></section>`+review();}
function draw(){const wg=S()==='wg',m=model(),base=state.snapshot?.scene===S()?state.snapshot.value:original[S()];
$('#value').textContent=(wg?fmt(m.radius,1)+' µm':fmt(state.values.mzm)+' mm');
$('[data-rev]').textContent='revision '+m.revision;
for(const e of document.querySelectorAll('[data-view]'))e.dataset.revision=String(m.revision);
$('#kpi1').textContent=wg?'Not evaluated':fmt(m.ratio)+'×';$('#kpi2').textContent=fmt(wg?m.footprint:m.lossLength)+'×';
$('#delta1').textContent=wg?'Solver not connected':`Δ ${fmt(m.ratio-2/base)}× vs comparison`;
$('#delta2').textContent=wg?`Δ ${fmt(m.footprint-((base+.225)/8.225)**2)}× vs comparison`:`Δ ${fmt(m.lossLength-base/2)}× vs comparison`;
$('#why').textContent=wg?'A gentler bend takes more room. Whether and how much optical loss falls needs a suitable bend model.':'More active length means more phase per volt and more propagation loss. Interference redistributes the output power.';
$('#comparison').textContent=`Comparison: ${fmt(base,wg?1:2)} ${wg?'µm':'mm'}${state.snapshot?.scene===S()?' · captured':' · Original'} · mock only`;
$('#restore').disabled=state.snapshot?.scene!==S();
if(wg){const r=40+(m.radius-2)/18*115,x=330-r,y=240-r;
$('#physical').innerHTML=`<svg viewBox="0 0 600 290" role="img" aria-label="Bend radius geometry only, no optical field simulation"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern></defs><rect width="600" height="290" fill="url(#grid)"/><rect x="${x-8}" y="${y-8}" width="${r+16}" height="${r+16}" fill="var(--soft)" stroke="var(--line)" stroke-dasharray="5 5"/><path d="M80 240 H${x} A${r} ${r} 0 0 0 330 ${y} V30" fill="none" stroke="var(--line)" stroke-width="22"/><path d="M80 240 H${x} A${r} ${r} 0 0 0 330 ${y} V30" fill="none" stroke="var(--teal)" stroke-width="6"/><path d="M${x} ${y} H330 M${x} ${y} V240" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${x+8}" y="${y+25}" style="fill:var(--amber)">R ${fmt(m.radius,1)} µm</text><text x="80" y="270" class="minor">Input</text><text x="355" y="42" class="minor">Output</text><text x="392" y="160">Routing area</text><text x="392" y="184" class="minor">${fmt(m.footprint)}× Original</text></svg>`;
$('#plot').innerHTML=plotSvg('wg',m);
}else{const end=225+(state.values.mzm-.5)/5.5*180,shift=m.phase/Math.PI;
$('#physical').innerHTML=`<svg viewBox="0 0 680 280" role="img" aria-label="Ideal MZI phase markers in the arms and interference after recombination"><path d="M25 140H110 M110 140L165 65H505L560 140H650 M110 140L165 215H505L560 140 M560 140L610 220H650" fill="none" stroke="var(--line)" stroke-width="15"/><path d="M25 140H110 M110 140L165 65H505L560 140 M110 140L165 215H505L560 140" fill="none" stroke="var(--teal)" stroke-width="3"/><rect x="195" y="43" width="${end-195}" height="44" rx="8" fill="var(--soft)" stroke="var(--teal)"/><rect x="195" y="193" width="${end-195}" height="44" rx="8" fill="var(--soft)" stroke="var(--teal)"/><text x="210" y="30" class="minor">Active length ${fmt(state.values.mzm)} mm · not to scale</text><path d="M${end+15} 65 l${12*Math.cos(m.phase/2)} ${-12*Math.sin(m.phase/2)} M${end+15} 215 l${12*Math.cos(-m.phase/2)} ${-12*Math.sin(-m.phase/2)}" stroke="var(--amber)" stroke-width="3"/><text x="430" y="115">Δφ = ${fmt(shift)}π</text><text x="210" y="134" class="minor">Fixed test drive</text><text x="210" y="156" class="minor">+ quadrature bias</text><path d="M560 140H650" stroke="var(--teal)" stroke-width="${3+15*m.main}"/><path d="M560 140L610 220H650" fill="none" stroke="var(--amber)" stroke-width="${3+15*(1-m.main)}"/><text x="575" y="113" class="minor">Main ${fmt(m.main,2)}</text><text x="530" y="261" class="minor">Complement ${fmt(1-m.main,2)}</text><text x="23" y="116" class="minor">Light in</text></svg>`;
$('#plot').innerHTML=plotSvg('mzm',m);
$('#constraints').hidden=state.mode!=='engineer';$('#discover').classList.toggle('active',state.mode==='discover');$('#engineer').classList.toggle('active',state.mode==='engineer');$('#discover').setAttribute('aria-pressed',state.mode==='discover');$('#engineer').setAttribute('aria-pressed',state.mode==='engineer');$('#targetStatus').textContent=m.ratio<=.8&&m.lossLength<=1.4?'Illustration lies inside both target bands · no engineering PASS':'Adjust length to explore the overlap · no progression gate';
}
if(innerWidth<=760)$('#physical').innerHTML=mobileDiagram(wg,m);
$('#announce').textContent=wg?`Radius ${m.radius} micrometers. Area ratio ${fmt(m.footprint)}. Bend loss not evaluated.`:`Length ${state.values.mzm} millimeters. Normalized voltage ${fmt(m.ratio)}, active loss ${fmt(m.lossLength)}. Illustration only.`;
}
function mobileDiagram(wg,m){
if(wg){const r=24+(m.radius-2)/18*35;return `<svg viewBox="0 0 320 92" role="img" aria-label="Bend geometry, loss not evaluated"><path d="M15 78 H${135-r} A${r} ${r} 0 0 0 135 ${78-r} V10" fill="none" stroke="var(--line)" stroke-width="14"/><path d="M15 78 H${135-r} A${r} ${r} 0 0 0 135 ${78-r} V10" fill="none" stroke="var(--teal)" stroke-width="4"/><text x="165" y="35" style="font-size:14px">R ${fmt(m.radius,1)} µm</text><text x="165" y="59" style="font-size:12px">Area ${fmt(m.footprint)}×</text><text x="165" y="79" class="minor">Geometry only</text></svg>`;}
const end=95+(state.values.mzm-.5)/5.5*70;return `<svg viewBox="0 0 320 92" role="img" aria-label="Phase shift in two arms and output interference, ideal schematic"><path d="M10 45H40L65 18H220L245 45H310 M40 45L65 73H220L245 45 M245 45L270 80H310" fill="none" stroke="var(--line)" stroke-width="9"/><path d="M10 45H40L65 18H220L245 45 M40 45L65 73H220L245 45" fill="none" stroke="var(--teal)" stroke-width="2"/><rect x="78" y="9" width="${end-78}" height="18" rx="4" fill="var(--soft)" stroke="var(--teal)"/><rect x="78" y="64" width="${end-78}" height="18" rx="4" fill="var(--soft)" stroke="var(--teal)"/><text x="85" y="49" style="font-size:13px">Δφ = ${fmt(m.phase/Math.PI)}π</text><path d="M245 45H310" stroke="var(--teal)" stroke-width="${2+8*m.main}"/><path d="M245 45L270 80H310" fill="none" stroke="var(--amber)" stroke-width="${2+8*(1-m.main)}"/><text x="250" y="25" style="font-size:12px">${fmt(m.main)}</text></svg>`;
}
function plotSvg(kind,m){const wg=kind==='wg',max=wg?20:6,min=wg?2:.5,ymax=wg?6.2:4,x=v=>60+(v-min)/(max-min)*480,y=v=>180-v/ymax*150,pts=[];for(let i=0;i<=80;i++){const v=min+(max-min)*i/80;pts.push(`${x(v)},${y(wg?((v+.225)/8.225)**2:2/v)}`);}const v=wg?m.radius:state.values.mzm,cur=wg?m.footprint:m.ratio;return `<svg viewBox="0 0 600 220" role="img" aria-label="${wg?'Geometric area ratio versus bend radius, optical bend loss unavailable':'Normalized voltage and active loss versus length, illustrative only'}"><path d="M60 30V180H540 M60 105H540 M60 30H540" fill="none" stroke="var(--line)"/><text x="15" y="35">${ymax}</text><text x="30" y="184">0</text><text x="60" y="208">${min}</text><text x="500" y="208">${max} ${wg?'µm':'mm'}</text><polyline points="${pts.join(' ')}" fill="none" stroke="var(--teal)" stroke-width="3"/>${wg?'<text x="140" y="65">Bend loss: solver not connected</text>':`<path d="M${x(.5)} ${y(.25)}L${x(6)} ${y(3)}" stroke="var(--amber)" stroke-width="3"/><circle cx="${x(v)}" cy="${y(m.lossLength)}" r="5" fill="var(--amber)"/>`}<path d="M${x(v)} 30V180" stroke="var(--muted)" stroke-dasharray="4 4"/><circle cx="${x(v)}" cy="${y(cur)}" r="6" fill="var(--teal)"/><text x="330" y="20">${wg?'Geometric ratio':'Relative to L₀ = 2 mm'}</text></svg>`;}
function learn(){const wg=S()==='wg',m=model();return `<p class="eyebrow">${wg?'Waveguide / bend radius':'MZM / phase shifter length'} · revision ${m.revision}</p><p>Current setting: <b>${wg?fmt(m.radius,1)+' µm':fmt(state.values.mzm)+' mm'}</b>. This panel reads the same memory state. It awards no progress.</p><h3>Intuition</h3><p>${wg?'Gentle curvature can reduce bend radiation at the cost of routing area. The magnitude depends on the cross-section, wavelength and transition shape.':'More active length gives more accumulated phase per volt. More propagation length also adds loss. The two arms recombine, converting relative phase into complementary output powers.'}</p><h3>Equations & what is shown</h3><div class="equation">${wg?'Area = (R + w/2)², w = 0.45 µm fixed UX geometry.<br>Area ratio = Area / Area(R₀ = 8 µm).<br>Optical bend loss = NOT EVALUATED.':'Vπ / Vπ₀ = L₀ / L; active loss / loss₀ = L / L₀.<br>Δφ = π(0.5 + 0.25 / (Vπ/Vπ₀)).<br>Main fraction = (1 + cos Δφ) / 2; complement = 1 − main.<br>Fractions refer to surviving power; no absolute power prediction.'}</div><h3>Model confidence & boundaries</h3><p><b>UX MOCK — NOT PHYSICS VERIFIED.</b> ${wg?'Existing KINDS.wg has a width control and scattering surrogate, not a bend-radius solver. LAB.routeLoss already computes arc radiation plus propagation from the strip model. P1 must review its lesson domain and bind the result; rib-ring routines are a different cross-section.':'These dimensionless fixtures demonstrate screen behavior, not existing engine output. P2 must bind the unmodified MZM/PN/Bench engine, name the voltage convention, include passive loss, and replace every fixture.'}</p><h3>What is deliberately absent</h3><p>No BER, FEC, compliance, calibrated field simulation, foundry readiness, or saved game changes. Opening this panel does not complete Discover or Engineer.</p><h3>Implementation sources</h3><p><a href="https://github.com/legendnever-collab/Spec-to-Mask/blob/289523340dedb04866a07151614c521654c16bc3/src/kinds/${wg?'wg':'mzm'}.js" target="_blank" rel="noopener">Existing ${wg?'waveguide':'MZM'} engine</a> · <a href="https://github.com/legendnever-collab/Spec-to-Mask/blob/feature/v2-learning-experience/docs/V2_REUSE_MAP.md" target="_blank" rel="noopener">P0 reuse and model limitations</a></p><p>Literature mapping and quantitative validation remain P1/P2 work. This preview claims no external validation.</p>`;}
function render(){app.innerHTML=S()==='overview'?overview():bench();document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>nav(b.dataset.scene));if(S()==='overview')return;
$('#knob').oninput=e=>{const v=Number(e.target.value);if(v!==state.values[S()]){state.values[S()]=v;state.revision++;state.observed[S()]=true;}draw();};
$('#compare').onclick=()=>{state.snapshot={scene:S(),value:state.values[S()]};draw();};
$('#restore').onclick=()=>{if(state.snapshot?.scene!==S())return;state.values[S()]=state.snapshot.value;state.revision++;$('#knob').value=state.values[S()];draw();};
$('#reset').onclick=()=>{state.values[S()]=original[S()];state.revision++;$('#knob').value=state.values[S()];draw();};
$('#learnButton').onclick=()=>{focusBefore=document.activeElement;$('#learnBody').innerHTML=learn();$('#learn').showModal();};
$('#discover').onclick=()=>{state.mode='discover';draw();};
if(S()==='mzm')$('#engineer').onclick=()=>{state.mode='engineer';draw();};
if(S()==='wg'){$('#continue').onclick=()=>{state.completed=state.observed.wg;nav('mzm');};$('#skip').onclick=()=>{state.skipped=true;nav('mzm');};}
draw();}
$('#engineTop').onclick=()=>nav('overview');$('#theme').onclick=()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'Light':'Dark';};
$('#closeLearn').onclick=()=>$('#learn').close();$('#learn').addEventListener('close',()=>focusBefore?.focus());
// Read-only hook for reproducible UI checks. Return a clone so tests cannot mutate state.
window.P0_REVIEW=Object.freeze({snapshot:()=>JSON.parse(JSON.stringify(state)),model:()=>({...model()}),version:'p0-ux-fixture/1'});
window.addEventListener('resize',()=>{if(S()!=='overview')draw();});
render();
</script></body></html>
